name: Automated XL ERP Timetable Sync

on:
  schedule:
    # Runs every hour from 7:00 AM to 7:00 PM IST (01:30 to 13:30 UTC):
    - cron: '30 1-13 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub website

permissions:
  contents: write

jobs:
  sync-timetable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Complete Term 5 Schedule from XL ERP (Sec E & Sec F)
        env:
          PYTHONUNBUFFERED: "1"
          XL_ERP_SEC_E_EMAIL: ${{ secrets.XL_ERP_SEC_E_EMAIL }}
          XL_ERP_SEC_E_PASSWORD: ${{ secrets.XL_ERP_SEC_E_PASSWORD }}
          XL_ERP_SEC_F_EMAIL: ${{ secrets.XL_ERP_SEC_F_EMAIL }}
          XL_ERP_SEC_F_PASSWORD: ${{ secrets.XL_ERP_SEC_F_PASSWORD }}
        run: |
          python sync_erp.py

      - name: Commit and Push Updated Timetable
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add term5_timetable.csv term5_schedule.json index.html "xlri_enrollment_dashboard (2).html"
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "Auto-sync Term 5 timetable from XL ERP [skip ci]"
            git push
          fi
