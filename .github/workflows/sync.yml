name: Sync Timetable from AIS

on:
  schedule:
    # Runs every hour from 7:00 AM to 7:00 PM IST (1:30 AM to 1:30 PM UTC)
    - cron: '30 1-13 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run AIS Sync Script
        env:
          AIS_USERNAME: ${{ secrets.AIS_USERNAME }}
          AIS_PASSWORD: ${{ secrets.AIS_PASSWORD }}
        run: |
          python sync_erp.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html term5_timetable.csv term5_schedule.json
          git commit -m "Auto-sync timetable data from AIS [skip ci]" || exit 0
          git push
