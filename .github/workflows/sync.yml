name: Automated XL ERP Timetable Sync

on:
  schedule:
    # Runs every hour from 7:00 AM to 7:00 PM IST (01:30 to 13:30 UTC):
    - cron: '30 1-13 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub website

permissions:
  contents: write

jobs:
  sync-timetable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Complete Term 5 Schedule from XL ERP (5 Students)
        env:
          PYTHONUNBUFFERED: "1"
          STUDENT_1_EMAIL: ${{ secrets.STUDENT_1_EMAIL }}
          STUDENT_1_PASSWORD: ${{ secrets.STUDENT_1_PASSWORD }}
          STUDENT_2_EMAIL: ${{ secrets.STUDENT_2_EMAIL }}
          STUDENT_2_PASSWORD: ${{ secrets.STUDENT_2_PASSWORD }}
          STUDENT_3_EMAIL: ${{ secrets.STUDENT_3_EMAIL }}
          STUDENT_3_PASSWORD: ${{ secrets.STUDENT_3_PASSWORD }}
          STUDENT_4_EMAIL: ${{ secrets.STUDENT_4_EMAIL }}
          STUDENT_4_PASSWORD: ${{ secrets.STUDENT_4_PASSWORD }}
          STUDENT_5_EMAIL: ${{ secrets.STUDENT_5_EMAIL }}
          STUDENT_5_PASSWORD: ${{ secrets.STUDENT_5_PASSWORD }}
        run: |
          python sync_erp.py

      - name: Commit and Push Updated Timetable
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add term5_timetable.csv term5_schedule.json index.html "xlri_enrollment_dashboard (2).html"
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "Auto-sync Term 5 timetable from XL ERP (5-Student Coverage) [skip ci]"
            git push
          fi
